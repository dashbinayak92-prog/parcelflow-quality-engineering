services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: parcelflow
      POSTGRES_USER: parcelflow
      POSTGRES_PASSWORD: parcelflow-local-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parcelflow -d parcelflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - parcelflow-postgres:/var/lib/postgresql/data
volumes:
  parcelflow-postgres:
