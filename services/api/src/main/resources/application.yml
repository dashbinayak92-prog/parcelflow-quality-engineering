spring:
  application:
    name: parcelflow-api
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/parcelflow}
    username: ${DATABASE_USER:parcelflow}
    password: ${DATABASE_PASSWORD:parcelflow-local-only}
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8090/realms/parcelflow}
          audiences: ${OIDC_AUDIENCE:parcelflow-api}
server:
  port: ${PORT:8080}
parcelflow:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  payments:
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:local-only-parcelflow-webhook-secret}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
info:
  app:
    name: ParcelFlow API
    description: Synthetic banking and payments QA demo
