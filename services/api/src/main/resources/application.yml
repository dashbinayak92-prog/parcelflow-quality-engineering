spring:
  application:
    name: parcelflow-api
  jackson:
    default-property-inclusion: non_null
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
info:
  app:
    name: ParcelFlow API
    description: Synthetic banking and payments QA demo
