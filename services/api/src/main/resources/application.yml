spring:
  application:
    name: parcelflow-api
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/parcelflow}
    username: ${DATABASE_USER:parcelflow}
    password: ${DATABASE_PASSWORD:parcelflow-local-only}
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
info:
  app:
    name: ParcelFlow API
    description: Synthetic banking and payments QA demo
