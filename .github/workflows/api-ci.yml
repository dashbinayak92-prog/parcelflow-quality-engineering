name: API CI

on:
  pull_request:
    paths:
      - 'services/api/**'
      - 'contracts/openapi/**'
      - '.github/workflows/api-ci.yml'
  push:
    branches: [main]
    paths:
      - 'services/api/**'
      - 'contracts/openapi/**'
      - '.github/workflows/api-ci.yml'

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify API
        working-directory: services/api
        run: mvn --batch-mode --no-transfer-progress verify
